name: Java CI

on:
  push:

# allow single build per branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# clear all permissions for GITHUB_TOKEN
permissions: {}

jobs:
  initial-build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Install mvnd (Maven Daemon)
        shell: bash
        run: |
          MVND_VERSION=1.0.2
          wget -q https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip
          unzip -q maven-mvnd-${MVND_VERSION}-linux-amd64.zip
          echo "$PWD/maven-mvnd-${MVND_VERSION}-linux-amd64/bin" >> $GITHUB_PATH
          # mvnd --version will run in next step after PATH is updated

      - name: Verify mvnd installation
        shell: bash
        run: |
          mvnd --version
          echo "mvnd installation successful"

      - name: Checkout maven
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          persist-credentials: false

#      - name: Prepare Mimir
#        shell: bash
#        run: |
#          mkdir -p ~/.mimir
#          cp .github/ci-extensions.xml ~/.m2/extensions.xml
#          cp .github/ci-mimir-daemon.properties ~/.mimir/daemon.properties
#
#      - name: Handle Mimir caches
#        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
#        with:
#          path: ~/.mimir/local
#          key: mimir-${{ runner.os }}-initial-${{ hashFiles('**/pom.xml') }}
#          restore-keys: |
#            mimir-${{ runner.os }}-initial-
#            mimir-${{ runner.os }}-

      - name: Set up Maven
        shell: bash
        run: mvn --errors --batch-mode --show-version org.apache.maven.plugins:maven-wrapper-plugin:3.3.2:wrapper "-Dmaven=4.0.0-rc-3"

      - name: Build Maven distributions
        shell: bash
        run: ./mvnw verify -e -B -V
      - name: List contents of target directory
        shell: bash
        run: ls -la apache-maven/target

      - name: Upload Maven distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-distributions
          path: |
            apache-maven/target/apache-maven*.zip
            apache-maven/target/apache-maven*.tar.gz

  full-build:
    needs: initial-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['21']
    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Install mvnd (Maven Daemon)
        shell: bash
        run: |
          MVND_VERSION=1.0.2
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -L -o mvnd.zip https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-windows-amd64.zip
            unzip -q mvnd.zip
            echo "$PWD/maven-mvnd-${MVND_VERSION}-windows-amd64/bin" >> $GITHUB_PATH
          elif [ "${{ runner.os }}" = "macOS" ]; then
            wget -q https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-darwin-amd64.zip
            unzip -q maven-mvnd-${MVND_VERSION}-darwin-amd64.zip
            xattr -r -d com.apple.quarantine maven-mvnd-${MVND_VERSION}-darwin-amd64 2>/dev/null || true
            echo "$PWD/maven-mvnd-${MVND_VERSION}-darwin-amd64/bin" >> $GITHUB_PATH
          else
            wget -q https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip
            unzip -q maven-mvnd-${MVND_VERSION}-linux-amd64.zip
            echo "$PWD/maven-mvnd-${MVND_VERSION}-linux-amd64/bin" >> $GITHUB_PATH
          fi

      - name: Verify mvnd installation
        shell: bash
        run: |
          echo "PATH: $PATH"
          which mvnd
          mvnd --version
          echo "mvnd installation successful"

      - name: Install Graphviz (MacOS)
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Install Graphviz (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install graphviz

      - name: Install Graphviz (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz

      - name: Checkout maven
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          persist-credentials: false

#      - name: Prepare Mimir
#        shell: bash
#        run: |
#          mkdir -p ~/.m2
#          mkdir -p ~/.mimir
#          cp .github/ci-extensions.xml ~/.m2/extensions.xml
#          cp .github/ci-mimir-daemon.properties ~/.mimir/daemon.properties
#
#      - name: Handle Mimir caches
#        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
#        with:
#          path: ~/.mimir/local
#          key: mimir-${{ runner.os }}-full-${{ hashFiles('**/pom.xml') }}
#          restore-keys: |
#            mimir-${{ runner.os }}-full-
#            mimir-${{ runner.os }}-

      - name: Download Maven distribution
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: maven-distributions
          path: maven-dist

      - name: List downloaded files
        shell: bash
        run: ls -la maven-dist

      - name: Extract Maven distribution
        shell: bash
        run: |
          mkdir -p maven-local
          if [ "${{ runner.os }}" = "Windows" ]; then
            unzip maven-dist/apache-maven-*-bin.zip -d maven-local
            # Get the name of the extracted directory
            MAVEN_DIR=$(ls maven-local)
            # Move contents up one level
            mv "maven-local/$MAVEN_DIR"/* maven-local/
            rm -r "maven-local/$MAVEN_DIR"
          else
            tar xzf maven-dist/apache-maven-*-bin.tar.gz -C maven-local --strip-components 1
          fi
          echo "MAVEN_HOME=$PWD/maven-local" >> $GITHUB_ENV
          echo "$PWD/maven-local/bin" >> $GITHUB_PATH

      - name: Build with downloaded Maven
        shell: bash
        run: |
          export PATH="$PWD/maven-mvnd-1.0.2-linux-amd64/bin:$PATH"  
          mvnd verify -Papache-release -Dgpg.skip=true -e -B -V
      - name: Build site with downloaded Maven
        shell: bash
        run: |
          export PATH="$PWD/maven-mvnd-1.0.2-linux-amd64/bin:$PATH"
          mvnd site -e -B -V -Preporting
      - name: Upload test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() || cancelled()
        with:
          name: ${{ github.run_number }}-full-build-artifact-${{ runner.os }}-${{ matrix.java }}
          path: '**/target/surefire-reports/*'

  integration-tests:
    needs: initial-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['21']
    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Install mvnd (Maven Daemon)
        shell: bash
        run: |
          MVND_VERSION=1.0.2
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -L -o mvnd.zip https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-windows-amd64.zip
            unzip -q mvnd.zip
            echo "$PWD/maven-mvnd-${MVND_VERSION}-windows-amd64/bin" >> $GITHUB_PATH
          elif [ "${{ runner.os }}" = "macOS" ]; then
            wget -q https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-darwin-amd64.zip
            unzip -q maven-mvnd-${MVND_VERSION}-darwin-amd64.zip
            xattr -r -d com.apple.quarantine maven-mvnd-${MVND_VERSION}-darwin-amd64 2>/dev/null || true
            echo "$PWD/maven-mvnd-${MVND_VERSION}-darwin-amd64/bin" >> $GITHUB_PATH
          else
            wget -q https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip
            unzip -q maven-mvnd-${MVND_VERSION}-linux-amd64.zip
            echo "$PWD/maven-mvnd-${MVND_VERSION}-linux-amd64/bin" >> $GITHUB_PATH
          fi

      - name: Verify mvnd installation
        shell: bash
        run: |
          mvnd --version
          echo "mvnd installation successful"

      - name: Checkout maven
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          persist-credentials: false

#      - name: Prepare Mimir
#        shell: bash
#        run: |
#          mkdir -p ~/.m2
#          mkdir -p ~/.mimir
#          cp .github/ci-extensions.xml ~/.m2/extensions.xml
#          cp .github/ci-mimir-daemon.properties ~/.mimir/daemon.properties
#
#      - name: Handle Mimir caches
#        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
#        with:
#          path: ~/.mimir/local
#          key: mimir-${{ runner.os }}-its-${{ hashFiles('**/pom.xml') }}
#          restore-keys: |
#            mimir-${{ runner.os }}-its-
#            mimir-${{ runner.os }}-

      - name: Download Maven distribution
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: maven-distributions
          path: maven-dist

      - name: List downloaded files
        shell: bash
        run: ls -la maven-dist

      - name: Extract Maven distribution
        shell: bash
        run: |
          mkdir -p maven-local
          if [ "${{ runner.os }}" = "Windows" ]; then
            unzip maven-dist/apache-maven-*-bin.zip -d maven-local
            # Get the name of the extracted directory
            MAVEN_DIR=$(ls maven-local)
            # Move contents up one level
            mv "maven-local/$MAVEN_DIR"/* maven-local/
            rm -r "maven-local/$MAVEN_DIR"
          else
            tar xzf maven-dist/apache-maven-*-bin.tar.gz -C maven-local --strip-components 1
          fi
          echo "MAVEN_HOME=$PWD/maven-local" >> $GITHUB_ENV
          echo "$PWD/maven-local/bin" >> $GITHUB_PATH

      - name: Build Maven and ITs and run them
        shell: bash
        run: |
          export PATH="$PWD/maven-mvnd-1.0.2-linux-amd64/bin:$PATH"  
          mvnd verify -e -B -V -Prun-its
      - name: Upload test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() || cancelled()
        with:
          name: ${{ github.run_number }}-integration-test-artifact-${{ runner.os }}-${{ matrix.java }}
          path: ./its/core-it-suite/target/test-classes/
